    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://eoyqmqwltpggcwkptrkg.supabase.co https://translate.google.com; connect-src 'self' https://eoyqmqwltpggcwkptrkg.supabase.co wss://eoyqmqwltpggcwkptrkg.supabase.co https://translate.google.com https://www.google.com; img-src 'self' data: https://www.google.com https://translate.google.com; style-src 'self' 'unsafe-inline' https://translate.googleapis.com https://fonts.googleapis.com https://translate.google.com; font-src 'self' data: https://translate.google.com https://fonts.gstatic.com;">
    <title>EU AI-Compliance Master</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <div id="google_translate_element" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt', // Idioma original do seu site
          includedLanguages: 'en,es,fr,de,it', // Idiomas que você quer oferecer
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      /* Remove a barra superior feia do Google que empurra o site para baixo */
      body { top: 0 !important; }
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      .goog-te-gadget-icon { display: none !important; }
      
      /* Ajusta o estilo do seletor para ficar mais limpo */
      .goog-te-gadget-simple {
        background-color: rgba(255, 255, 255, 0.9) !important;
        border: 1px solid #e2e8f0 !important;
        padding: 8px !important;
        border-radius: 8px !important;
        font-family: sans-serif !important;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1) !important;
      }
    </style>
